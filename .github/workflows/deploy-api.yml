name: deploy-api

# HEAT-C006 — API deployment pipeline. Manual gate on purpose: a human picks
# the environment. Order is fixed: build immutable image → migrate → smoke →
# release traffic. Migrations NEVER run inside random API boots; the running
# image assumes the schema its tag was built against.
#
# Provisioning prerequisites (one-time, per environment) are documented in
# docs/runbooks/deploy-api.md. Missing secrets fail the job loudly.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build immutable image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=ghcr.io/kyleqd/heat-api:${GITHUB_SHA::12}-${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply migrations
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight — DATABASE_URL configured?
        env:
          DB: ${{ secrets.DEPLOY_DATABASE_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::error::Secret 'DEPLOY_DATABASE_URL' not set for environment '${{ inputs.environment }}'. See docs/runbooks/deploy-api.md."
            exit 1
          fi
          case "$DB" in
            postgres://heat_migrator@*|postgresql://heat_migrator@*) ;;
            *) echo "::warning::DEPLOY_DATABASE_URL should use the heat_migrator identity (HEAT-C002)." ;;
          esac
      # Migrations run from the SAME immutable image that will serve traffic,
      # using the migrator role — never the runtime API identity.
      - name: Run migrations (migrator identity)
        env:
          DB: ${{ secrets.DEPLOY_DATABASE_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL="$DB" \
            -e NODE_ENV=production \
            ${{ needs.build.outputs.tag }} \
            npx tsx apps/api/src/db/migrateCli.ts up

  release:
    name: Deploy + smoke + enable traffic
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Rolling restart onto the new image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ needs.build.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::Deploy target not provisioned for '${{ inputs.environment }}' (DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY unset). Follow docs/runbooks/deploy-api.md to provision, then re-run."
            exit 1
          fi
          install -m 600 /dev/null key
          printf '%s' "$DEPLOY_KEY" > key
          ssh -i key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /opt/heat/bin/rolling-deploy '$IMAGE'"
      # Smoke gates traffic enablement; the load balancer only flips when this
      # returns ready.
      - name: Readiness smoke
        run: |
          url="${{ vars.HEAT_PUBLIC_BASE_URL }}/v1/ready"
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then cat /tmp/ready.json; exit 0; fi
            sleep 2
          done
          echo "::error::Readiness never went healthy at $url"; exit 1
