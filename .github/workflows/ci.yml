name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: heat
          POSTGRES_PASSWORD: heat
          POSTGRES_DB: heat
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U heat -d heat"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://heat:heat@localhost:5433/heat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck all workspaces
        run: |
          npx tsc --noEmit -p ../../packages/domain
          npx tsc --noEmit -p ../../packages/config
          npx tsc --noEmit -p ../../packages/api-contracts
          npx tsc --noEmit -p .
      - name: Dependency audit (prod deps, high+)
        working-directory: .
        run: npm audit --omit=dev --audit-level=high
      - name: Migrate + seed
        run: |
          npx tsx src/db/migrateCli.ts up
          npx tsx seeds/las_vegas.ts
      - name: Unit + integration tests
        run: npx vitest run
      # B009 — migration rollback smoke on the newest migration, then re-apply,
      # proving the reversible path stays executable (never cascading).
      - name: Migration rollback smoke
        run: |
          npx tsx src/db/migrateCli.ts down
          npx tsx src/db/migrateCli.ts up

  ios-core:
    name: ios-core
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios/HeatKit
    steps:
      - uses: actions/checkout@v4
      # Full Xcode on the runner → XCTest is authoritative, never a warning.
      - run: swift build
      - name: Verification harness
        run: swift run heatkit-check
      - name: XCTest suite (gating)
        run: swift test

  ios-app:
    name: ios-app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build app target (simulator, unsigned)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Heat.xcodeproj \
            -scheme Heat \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" /tmp/build.log
      - name: Unit tests via app scheme
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Heat.xcodeproj \
            -scheme Heat \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log | grep -E "Test Case|error:|TEST" || true
          grep -q "TEST SUCCEEDED" /tmp/test.log

  # B008 — archive validation. A Staging archive must build cleanly and carry
  # its real injected API URL, staging identity, version/build numbers, the
  # app icon and the privacy manifest — no signing required for simulator.
  ios-archive:
    name: ios-archive
    runs-on: macos-15
    env:
      CURRENT_PROJECT_VERSION: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Archive Staging (generic simulator, unsigned)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Heat.xcodeproj \
            -scheme Heat \
            -destination 'generic/platform=iOS Simulator' \
            -archivePath /tmp/Heat.xcarchive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/archive.log | grep -E "error:|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" /tmp/archive.log
      - name: Validate archive contents
        run: |
          APP=$(find /tmp/Heat.xcarchive -name "*.app" -maxdepth 4 | head -1)
          test -n "$APP"
          PLIST="$APP/Info.plist"
          url=$(/usr/libexec/PlistBuddy -c "Print :HEAT_API_BASE_URL" "$PLIST")
          case "$url" in
            https://*) ;;
            *) echo "HEAT_API_BASE_URL not https: $url"; exit 1 ;;
          esac
          case "$url" in
            *invalid*|*example*|*unset.*|*localhost*) echo "placeholder URL leaked: $url"; exit 1 ;;
          esac
          bid=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          test "$bid" = "com.heatapp.ios.staging"
          name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          case "$name" in
            HEAT|HEAT\ Staging) ;;
            *) echo "unexpected display name: $name"; exit 1 ;;
          esac
          short=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          test -n "$short" && test "$build" -gt 0
          minos=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST")
          test "$minos" = "17.0"
          test -f "$APP/AppIcon60x60@2x.png" || ls "$APP" | grep -q AppIcon
          test -f "$APP/PrivacyInfo.xcprivacy"
          echo "Archive validation passed: $bid $short ($build) → $url"
