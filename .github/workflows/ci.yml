name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — typecheck + tests (+PostGIS integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: heat
          POSTGRES_PASSWORD: heat
          POSTGRES_DB: heat
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U heat -d heat"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://heat:heat@localhost:5433/heat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck all workspaces
        run: |
          npx tsc --noEmit -p ../../packages/domain
          npx tsc --noEmit -p ../../packages/config
          npx tsc --noEmit -p ../../packages/api-contracts
          npx tsc --noEmit -p .
      - name: Migrate + seed
        run: |
          npx tsx src/db/migrateCli.ts up
          npx tsx seeds/las_vegas.ts
      - name: Unit + integration tests
        run: npx vitest run

  ios-core:
    name: iOS core — HeatKit build + tests (required)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios/HeatKit
    steps:
      - uses: actions/checkout@v4
      # Full Xcode on the runner → XCTest is authoritative, never a warning.
      - run: swift build
      - name: Verification harness
        run: swift run heatkit-check
      - name: XCTest suite (gating)
        run: swift test

  ios-app:
    name: iOS app — xcodegen + build + unit tests (Phase B)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build app target (simulator, unsigned)
        working-directory: apps/ios
        run: |
          set -o pipefail
          set -o pipefail
          xcodebuild build \
            -project Heat.xcodeproj \
            -scheme Heat \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" /tmp/build.log
      - name: Unit tests via app scheme
        working-directory: apps/ios
        run: |
          set -o pipefail
          set -o pipefail
          xcodebuild test \
            -project Heat.xcodeproj \
            -scheme Heat \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log | grep -E "Test Case|error:|TEST" || true
          grep -q "TEST SUCCEEDED" /tmp/test.log
