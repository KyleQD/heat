services:
  db:
    image: postgis/postgis:16-3.4
    container_name: heat-db
    environment:
      POSTGRES_USER: heat
      POSTGRES_PASSWORD: heat
      POSTGRES_DB: heat
    ports:
      - "5433:5432"
    volumes:
      - heat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heat -d heat"]
      interval: 3s
      timeout: 3s
      retries: 20

  # HEAT-C003 — shared cache for multi-replica correctness. Local stack runs
  # one API, but the port mirrors staging so REDIS_URL habits transfer.
  redis:
    image: redis:7-alpine
    container_name: heat-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  heat_pgdata:
