name: Heat
options:
  bundleIdPrefix: com.heatapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# B002 — explicit build configurations. Staging compiles with release
# optimizations but carries its own identity + API endpoint.
configs:
  Debug: debug
  Staging: release
  Release: release

# Phase B policy (B001): project.yml is the single source of truth; the
# generated Heat.xcodeproj is gitignored and regenerated in CI and locally.
# Never hand-edit the .xcodeproj.
#
# Generation-time environment (documented in docs/RELEASE_ENGINEERING.md):
#   HEAT_DEVELOPMENT_TEAM   Apple team id ("" for unsigned simulator CI builds)
#   CURRENT_PROJECT_VERSION monotonic build number injected by release CI
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${HEAT_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}

packages:
  HeatKit:
    path: HeatKit

targets:
  Heat:
    type: application
    platform: iOS
    sources:
      - path: Heat
    dependencies:
      - package: HeatKit
        product: HeatKit
      # System frameworks (MapKit) are auto-linked via imports — do not add
      # them as file dependencies or xcodegen treats them as vendored binaries.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "HEAT uses your location to show events happening near you and to route you there. Your exact location is never stored."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          # Local docker-compose stack.
          PRODUCT_BUNDLE_IDENTIFIER: com.heatapp.ios
          HEAT_API_BASE_URL: http://localhost:8787
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Staging:
          # TestFlight-adjacent internal builds. The URL is REQUIRED at
          # generation time (export HEAT_STAGING_API_URL=...); an unset value
          # would fail xcodegen expansion loudly rather than shipping empty.
          PRODUCT_BUNDLE_IDENTIFIER: com.heatapp.ios.staging
          INFOPLIST_KEY_CFBundleDisplayName: HEAT Staging
          HEAT_API_BASE_URL: ${HEAT_STAGING_API_URL}
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
        Release:
          # App Store / production. Same contract as Staging with the
          # production API. A placeholder that reaches a binary fails fast at
          # boot (see AppEnvironment) and is rejected by archive validation.
          PRODUCT_BUNDLE_IDENTIFIER: com.heatapp.ios
          INFOPLIST_KEY_CFBundleDisplayName: HEAT
          HEAT_API_BASE_URL: ${HEAT_RELEASE_API_URL}
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
    info:
      path: Heat/Info.plist
      properties:
        CFBundleDisplayName: HEAT
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "HEAT uses your location to show events happening near you and to route you there. Your exact location is never stored."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - comgooglemaps
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - heat

  HeatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeatKit/Tests/HeatKitTests
    dependencies:
      - target: Heat
      - package: HeatKit
        product: HeatKit

schemes:
  Heat:
    build:
      targets:
        Heat: all
        HeatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeatTests
    archive:
      config: Staging
