name: Heat
options:
  bundleIdPrefix: com.heatapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  HeatKit:
    path: HeatKit

targets:
  Heat:
    type: application
    platform: iOS
    sources:
      - path: Heat
        excludes:
          - "**/*.xcprivacy.bak"
    dependencies:
      - package: HeatKit
        product: HeatKit
      - framework: MapKit.framework
        implicit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heatapp.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "HEAT uses your location to show events happening near you and to route you there. Your exact location is never stored."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CFBundleDisplayName: HEAT
        SUPPORTS_MACCATALYST: NO
        # Debug points at the local stack; Release is injected per build below.
        HEAT_API_BASE_URL: http://localhost:8787
      configs:
        Release:
          # Phase B: CI injects HEAT_RELEASE_API_URL; a placeholder in a
          # release binary fails fast at boot (see AppEnvironment).
          HEAT_API_BASE_URL: ${HEAT_RELEASE_API_URL:-https://unset.release.api.invalid}
    info:
      path: Heat/Info.plist
      properties:
        CFBundleDisplayName: HEAT
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "HEAT uses your location to show events happening near you and to route you there. Your exact location is never stored."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - comgooglemaps
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - heat

  HeatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Heat
        excludes:
          - "**/*.xcprivacy.bak"Kit/Tests/HeatKitTests
    dependencies:
      - target: Heat
      - package: HeatKit
        product: HeatKit

schemes:
  Heat:
    build:
      targets:
        Heat: all
        HeatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeatTests
